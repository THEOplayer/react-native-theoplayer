name: Build Web on PRs
on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  # Always register a check on every PR so it can be a required status check;
  # the real jobs below are skipped when no relevant files changed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            web:
              - '.github/workflows/pr_web.yml'
              - 'example/**'
              - 'e2e/**'
              - '!e2e/ios/**'
              - '!e2e/android/**'
              - 'package.json'
              - 'src/**'

  build:
    needs: changes
    if: needs.changes.outputs.web == 'true' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run npm install SDK
        run: |
          npm i -g corepack
          npm ci

      - name: Run npm install example
        working-directory: example
        run: npm ci

      - name: Build Web example
        working-directory: example
        run: npm run web-release

      - name: Save WEB to artifacts
        uses: actions/upload-artifact@v7
        with:
          name: web-release
          path: example/dist
          retention-days: 3

  e2e:
    needs: changes
    if: needs.changes.outputs.web == 'true' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Run npm install SDK
        run: |
          npm i -g corepack
          npm ci

      - name: Run npm install e2e
        working-directory: e2e
        run: npm ci

      - name: Run web e2e tests
        working-directory: e2e
        run: npm run test:e2e:web -- --markdown

      - name: Summarize results
        working-directory: e2e
        if: always()
        run: cat cavynext_results.md >> $GITHUB_STEP_SUMMARY
