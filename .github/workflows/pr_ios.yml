name: Build iOS on PRs
on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  # Always register a check on every PR so it can be a required status check;
  # the real build job below is skipped when no relevant files changed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ios:
              - '.github/workflows/pr_ios.yml'
              - 'Gemfile'
              - 'example/**'
              - 'e2e/**'
              - '!e2e/android/**'
              - 'package.json'
              - 'src/**'
              - 'ios/**'

  build:
    needs: changes
    if: needs.changes.outputs.ios == 'true' && github.event.pull_request.draft == false
    # Temporarily compare against the previous Xcode 26 toolchain.
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        xcode_version: [ '26.2.0' ]
        platform: [iOS, tvOS]
        include:
          - platform: iOS
            simulator: iPhone 17
            scheme: ReactNativeTHEOplayer
          - platform: tvOS
            simulator: Apple TV 4K (3rd generation)
            scheme: ReactNativeTHEOplayer-tvOS
    name: Build for ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode ${{ matrix.xcode_version }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode_version }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Cache Ruby Gems
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-${{ runner.arch }}-gems-${{ hashFiles('Gemfile', '**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-gems-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: e2e/ios/Pods
          key: pods-${{ runner.os }}-${{ runner.arch }}-${{ matrix.xcode_version }}-${{ hashFiles('e2e/ios/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-${{ runner.arch }}-${{ matrix.xcode_version }}-

      - name: Run patch scripts
        working-directory: e2e
        run: bash ./scripts/patch_ios_podspec.sh

      - name: Run npm install
        run: |
          npm i -g corepack
          npm ci
          cd e2e
          npm ci
          npm run update-dependencies
          npm install

      - name: Install Ruby dependencies
        run: bundle install

      - name: Run pod install & update dependencies
        working-directory: e2e/ios
        run: |
          bundle exec pod update

      - name: Start iOS simulator
        id: simulator
        uses: futureware-tech/simulator-action@v4
        with:
          model: ${{ matrix.simulator }}
          os: ${{ matrix.platform }}
          os_version: '26.2'
          wait_for_boot: true
          shutdown_after_job: ${{ matrix.platform != 'tvOS' }}

      - name: Run native ad bridge tests
        working-directory: e2e/ios
        env:
          RCT_NO_LAUNCH_PACKAGER: '1'
        run: |
          SCHEME="${{ matrix.platform == 'iOS' && 'ReactNativeTHEOplayer' || 'ReactNativeTHEOplayer-tvOS' }}"
          xcodebuild test -workspace ReactNativeTHEOplayer.xcworkspace -scheme "$SCHEME" \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -only-testing:"${SCHEME}Tests/AdAdapterCustomDataTests" \
            CODE_SIGNING_ALLOWED=NO

      - name: Run e2e tests
        working-directory: e2e
        # --buildCmd preserves simulator-name quoting that Cavynext's argument forwarding loses.
        run: >-
          npm run test:e2e:${{ matrix.platform == 'iOS' && 'ios' || 'tvos' }} -- --markdown
          --buildCmd 'npx react-native run-ios --terminal bash
          --scheme "${{ matrix.scheme }}" --simulator "${{ matrix.simulator }} (26.2)"'

      - name: Summarize results
        working-directory: e2e
        if: always()
        run: cat cavynext_results.md >> $GITHUB_STEP_SUMMARY

      - name: Upload diagnostic reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.platform }}-xcode-${{ matrix.xcode_version }}
          if-no-files-found: warn
          path: |
            ~/Library/Logs/DiagnosticReports
            ~/Library/Logs/CoreSimulator
            ~/Library/Developer/CoreSimulator/Devices/${{ steps.simulator.outputs.udid }}/data/Library/Logs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-${{ matrix.platform }}-xcode-${{ matrix.xcode_version }}
          path: e2e/screenshots
