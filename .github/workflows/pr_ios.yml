name: Build iOS on PRs
on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  # Always register a check on every PR so it can be a required status check;
  # the real build job below is skipped when no relevant files changed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ios:
              - '.github/workflows/pr_ios.yml'
              - 'Gemfile'
              - 'example/**'
              - 'e2e/**'
              - '!e2e/android/**'
              - 'package.json'
              - 'src/**'
              - 'ios/**'

  build:
    needs: changes
    if: needs.changes.outputs.ios == 'true' && github.event.pull_request.draft == false
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        xcode_version: [ '27.1.0' ]
        platform: [iOS, tvOS]
    name: Build for ${{ matrix.platform }} using XCode version ${{ matrix.xcode_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode ${{ matrix.xcode_version }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode_version }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Cache Ruby Gems
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-${{ runner.arch }}-gems-${{ hashFiles('Gemfile', '**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-gems-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: e2e/ios/Pods
          key: pods-${{ runner.os }}-${{ runner.arch }}-${{ matrix.xcode_version }}-${{ hashFiles('e2e/ios/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-${{ runner.arch }}-${{ matrix.xcode_version }}-

      - name: Run patch scripts
        working-directory: e2e
        run: bash ./scripts/patch_ios_podspec.sh

      - name: Run npm install
        run: |
          npm i -g corepack
          npm ci
          cd e2e
          npm ci
          npm run update-dependencies
          npm install

      - name: Install Ruby dependencies
        run: bundle install

      - name: Run pod install & update dependencies
        working-directory: e2e/ios
        run: |
          bundle exec pod update

      - name: Start iOS simulator
        id: simulator
        uses: futureware-tech/simulator-action@v4
        with:
          model: ${{ matrix.platform == 'iOS' && 'iPhone 17' || '' }}
          os: ${{ matrix.platform }}
          os_version: '27.0'
          wait_for_boot: true

      - name: Run e2e tests
        if: matrix.platform == 'iOS'
        working-directory: e2e
        run: npm run test:e2e:ios -- --udid "${{ steps.simulator.outputs.udid }}" --markdown

      - name: Run tvOS e2e tests
        if: matrix.platform == 'tvOS'
        working-directory: e2e
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          npm run start -- --port 8081 > "$RUNNER_TEMP/metro-tvos.log" 2>&1 &
          metro_pid=$!
          trap 'kill "$metro_pid" 2>/dev/null || true' EXIT

          for attempt in {1..60}; do
            if curl --silent --fail http://localhost:8081/status; then
              break
            fi
            sleep 1
          done
          if ! curl --silent --fail http://localhost:8081/status; then
            cat "$RUNNER_TEMP/metro-tvos.log"
            exit 1
          fi

          export E2E_DERIVED_DATA="$RUNNER_TEMP/theoplayer-tvos"
          # The RN CLI can misclassify tvOS simulators as physical devices on Xcode 27.
          npm run test:e2e:tvos -- --markdown --buildCmd 'set -eu
            xcodebuild -workspace ios/ReactNativeTHEOplayer.xcworkspace \
              -scheme ReactNativeTHEOplayer-tvOS -configuration Debug \
              -sdk appletvsimulator -destination "id=$SIMULATOR_UDID" \
              -derivedDataPath "$E2E_DERIVED_DATA" CODE_SIGNING_ALLOWED=NO build
            app_path="$E2E_DERIVED_DATA/Build/Products/Debug-appletvsimulator/ReactNativeTHEOplayer-tvOS.app"
            bundle_id=$(/usr/libexec/PlistBuddy -c Print:CFBundleIdentifier "$app_path/Info.plist")
            xcrun simctl install "$SIMULATOR_UDID" "$app_path"
            xcrun simctl launch "$SIMULATOR_UDID" "$bundle_id"'

      - name: Summarize results
        working-directory: e2e
        if: always()
        run: cat cavynext_results.md >> $GITHUB_STEP_SUMMARY

      - name: Collecting logs
        if: failure()
        run: xcrun simctl spawn booted log collect --output ~/crashlog.logarchive

      - name: Upload crash logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-logs-${{ matrix.platform }}-xcode-${{ matrix.xcode_version }}
          path: ~/crashlog.logarchive

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-${{ matrix.platform }}-xcode-${{ matrix.xcode_version }}
          path: e2e/screenshots
